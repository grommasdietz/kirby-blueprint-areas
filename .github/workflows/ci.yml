name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: grommasdietz/.github/.github/workflows/kirby-plugin.yml@v1
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      php: '8.3'
      browsers: chromium
      compatibility: '[{"php": "8.2", "composer": "playground", "command": "composer test:smoke"}, {"php": "8.4"}, {"php": "8.5"}, {"php": "8.3", "composer": "none", "command": "sh tools/kirby-compat.sh 5.6.0", "name": "Kirby 5.6.0 compatibility"}, {"php": "8.3", "composer": "none", "command": "sh tools/kirby-compat.sh ^5.6", "name": "Kirby ^5.6 compatibility"}, {"php": "8.3", "kirby": "6.0.0-rc.1", "ref": "kirby-6", "node": true, "browsers": "chromium", "command": "composer verify && pnpm verify", "name": "Kirby 6 native branch"}]'
    secrets: inherit
