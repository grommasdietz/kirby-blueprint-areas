name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: grommasdietz/.github/.github/workflows/kirby-plugin.yml@v1
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      php: '8.3'
      browsers: chromium
      compatibility: '[{"php": "8.4"}, {"php": "8.5"}, {"php": "8.3", "composer": "none", "command": "sh tools/kirby-compat.sh 6.0.0", "name": "Kirby 6.0.0 compatibility"}, {"php": "8.3", "composer": "none", "command": "sh tools/kirby-compat.sh ^6.0", "name": "Kirby ^6.0 compatibility"}]'
    secrets: inherit
