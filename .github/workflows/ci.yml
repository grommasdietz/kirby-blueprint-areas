name: CI/CD Pipeline
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-verify
      cancel-in-progress: true
    name: PHP 8.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verification work
        id: changes
        run: python3 -B .github/scripts/ci-changes.py
      - name: Test verification boundaries
        run: python3 -B .github/scripts/test-ci-changes.py
      - name: Verify documentation only
        if: steps.changes.outputs.full == 'false'
        run: python3 -B .github/scripts/ci-changes.py docs
      - name: Test dependency merge boundaries
        run: python3 -B .github/scripts/test-dependabot-merge.py
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/scripts/dependabot-merge.py title
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, gd, json, mbstring, simplexml
          coverage: none
          tools: composer:v2
        if: steps.changes.outputs.full == 'true'
      - name: Synchronize playground lock metadata
        run: composer update -d playground --lock --no-install --no-scripts --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - name: Install playground dependencies
        run: composer install -d playground --prefer-dist --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - name: Verify minimum runtime
        run: composer test:smoke
        if: steps.changes.outputs.full == 'true'
      - name: Synchronize root lock metadata
        run: composer update --lock --no-install --no-scripts --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - name: Install root development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-version
        if: steps.changes.outputs.full == 'true'
      - name: Check platform requirements
        run: composer check-platform-reqs
        if: steps.changes.outputs.full == 'true'
      - name: Lint PHP
        run: composer lint
        if: steps.changes.outputs.full == 'true'
      - name: Static analysis
        run: composer psalm -- --show-info=false --output-format=github --no-cache
        if: steps.changes.outputs.full == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.full == 'true'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
        if: steps.changes.outputs.full == 'true'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.full == 'true'
      - name: Verify third-party notices
        run: |
          composer notices:generate
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
        if: steps.changes.outputs.full == 'true'
      - name: Check release readiness
        run: composer release:check
        if: steps.changes.outputs.full == 'true'
      - name: Run PHPUnit suites
        run: composer test:unit && composer test:integration
        if: steps.changes.outputs.full == 'true'
      - name: Lint JavaScript
        run: pnpm lint
        if: steps.changes.outputs.full == 'true'
      - name: Check TypeScript
        run: pnpm run check:types
        if: steps.changes.outputs.full == 'true'
      - name: Verify generated assets
        run: pnpm build:check
        if: steps.changes.outputs.full == 'true'
      - name: Verify Panel bundle
        run: pnpm test:bundle
        if: steps.changes.outputs.full == 'true'
      - name: Verify source archive
        run: pnpm test:archive
        if: steps.changes.outputs.full == 'true'
      - name: Verify documentation
        run: pnpm docs:verify
        if: steps.changes.outputs.full == 'true'
      - name: Check repository hygiene
        run: pnpm test:hygiene
        if: steps.changes.outputs.full == 'true'
      - name: Synchronize playground lock metadata
        run: composer update -d playground --lock --no-install --no-scripts --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - name: Synchronize root lock metadata
        run: composer update --lock --no-install --no-scripts --no-progress --no-interaction
        if: steps.changes.outputs.full == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.changes.outputs.full == 'true'
      - name: Run browser tests
        run: pnpm test:browser
        if: steps.changes.outputs.full == 'true'
      - name: Run custom API slug browser test
        run: pnpm test:browser:api-slug
        if: steps.changes.outputs.full == 'true'
      - name: Upload Playwright artifacts
        if: (steps.changes.outputs.full == 'true') && (failure())
        uses: actions/upload-artifact@v7
        with:
          name: kirby-blueprint-areas-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify release toolchain
        if: steps.changes.outputs.full == 'true'
        run: node --test tools/release-toolchain.test.mjs tools/third-party-notices.test.mjs
    outputs:
      full: ${{ steps.changes.outputs.full }}
      release: ${{ steps.changes.outputs.release }}
      deploy: ${{ steps.changes.outputs.deploy }}
  php:
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-php-${{ matrix.php-version }}
      cancel-in-progress: true
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            full-suite: false
          - php-version: '8.4'
            full-suite: true
          - php-version: '8.5'
            full-suite: true
    steps:
      - name: Use verified documentation result
        if: needs.verify.outputs.full == 'false'
        run: echo "Documentation was verified by the primary CI job; this required compatibility status is satisfied."
      - uses: actions/checkout@v7
        if: needs.verify.outputs.full == 'true'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, gd, json, mbstring, simplexml
          coverage: none
          tools: composer:v2
        if: needs.verify.outputs.full == 'true'
      - name: Synchronize playground lock metadata
        run: composer update -d playground --lock --no-install --no-scripts --no-progress --no-interaction
        if: needs.verify.outputs.full == 'true'
      - name: Install playground dependencies
        run: composer install -d playground --prefer-dist --no-progress --no-interaction
        if: needs.verify.outputs.full == 'true'
      - name: Verify minimum runtime
        run: composer test:smoke
        if: needs.verify.outputs.full == 'true'
      - name: Synchronize root lock metadata
        if: (needs.verify.outputs.full == 'true') && (matrix.full-suite)
        run: composer update --lock --no-install --no-scripts --no-progress --no-interaction
      - name: Install root development dependencies
        if: (needs.verify.outputs.full == 'true') && (matrix.full-suite)
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPUnit suites
        if: (needs.verify.outputs.full == 'true') && (matrix.full-suite)
        run: composer test:unit && composer test:integration
    timeout-minutes: 15
    needs:
      - verify
  kirby:
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-kirby-${{ matrix.kirby-version }}
      cancel-in-progress: true
    name: Kirby ${{ matrix.kirby-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kirby-version: 5.6.0
            label: minimum-supported
          - kirby-version: ^5.6
            label: latest-compatible
    steps:
      - name: Use verified documentation result
        if: needs.verify.outputs.full == 'false'
        run: echo "Documentation was verified by the primary CI job; this required compatibility status is satisfied."
      - uses: actions/checkout@v7
        if: needs.verify.outputs.full == 'true'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, gd, json, mbstring, simplexml
          coverage: none
          tools: composer:2.10.2, phpunit:12.5.30
        if: needs.verify.outputs.full == 'true'
      - name: Create isolated compatibility manifest
        env:
          KIRBY_VERSION: ${{ matrix.kirby-version }}
        run: |
          php <<'PHP'
          <?php

          declare(strict_types=1);

          $version = getenv('KIRBY_VERSION');

          if (is_string($version) === false || $version === '') {
              throw new RuntimeException('Missing Kirby version');
          }

          $manifest = [
              'name' => 'grommasdietz/kirby-blueprint-areas-compat',
              'description' => 'Temporary Kirby compatibility test project',
              'type' => 'project',
              'require' => [
                  'php' => '^8.2',
                  'getkirby/cms' => $version,
              ],
              'autoload' => [
                  'psr-4' => [
                      'GrommasDietz\\Areas\\' => 'lib/',
                  ],
              ],
              'config' => [
                  'allow-plugins' => [
                      'getkirby/composer-installer' => true,
                  ],
                  'platform' => [
                      'php' => '8.3.16',
                  ],
                  'sort-packages' => true,
              ],
          ];

          file_put_contents(
              'composer.compat.json',
              json_encode(
                  $manifest,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );
          PHP
        if: needs.verify.outputs.full == 'true'
      - name: Install target Kirby version
        shell: bash
        env:
          COMPOSER: composer.compat.json
        run: |
          composer update \
            --with-all-dependencies \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --no-scripts

          composer show getkirby/cms
        if: needs.verify.outputs.full == 'true'
      - name: Run Kirby compatibility suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/compatibility

          phpunit \
            --configuration phpunit.compat.xml.dist \
            --testsuite "Kirby compatibility" \
            --display-all-issues \
            --testdox \
            --log-junit "build/compatibility/kirby-${{ matrix.label }}.xml" \
            2>&1 | tee "build/compatibility/kirby-${{ matrix.label }}.log"
        if: needs.verify.outputs.full == 'true'
      - name: Upload compatibility diagnostics
        if: (needs.verify.outputs.full == 'true') && (failure())
        uses: actions/upload-artifact@v7
        with:
          name: kirby-${{ matrix.label }}-compatibility
          path: build/compatibility/
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 15
    needs:
      - verify
  release:
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Semantic release
    runs-on: ubuntu-latest
    needs:
      - verify
      - php
      - kirby
    if: (needs.verify.outputs.release == 'true') && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    steps:
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GD_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GD_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-token.outputs.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          HUSKY: 0
    timeout-minutes: 15
'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      force_release:
        description: Retry verified plugin publication after a maintenance commit
        type: boolean
        default: false
