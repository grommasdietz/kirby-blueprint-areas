# pnpm 11 keeps the lockfile readable by GitHub dependency scanning.
# Revisit the pin when GitHub supports pnpm 12 multi-document lockfiles.
packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

nodeLinker: isolated

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
overrides:
  # Security fixes for installed tooling; selectors stop matching fixed upstream dependencies.
  semantic-release>@semantic-release/npm: "-"
  minimatch@>=9 <11.0.1: ^11.0.1
  katex@<0.18.2: ^0.18.2
  js-yaml@>=5 <5.4.1: ^5.4.1
  smol-toml@<1.9.0: ^1.9.0
  re2js@>=2.2.0 <2.8.7: ^2.8.7
